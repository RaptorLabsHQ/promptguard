<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="g" x1="400" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#050303"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D63B3B"/>
      <stop offset="0.5" stop-color="#A20F10"/>
      <stop offset="1" stop-color="#6E0B0C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#g)"/>
  <rect width="800" height="200" rx="12" stroke="#302C2D" stroke-width="1"/>

  <!-- Shield -->
  <g transform="translate(60,40)">
    <path d="M 50 6 L 82 17 v 26 c 0 18 -13 31 -32 37 -19 -6 -32 -19 -32 -37 V 17 Z" fill="#0e0909" stroke="url(#sh)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Range rings -->
    <circle cx="50" cy="50" r="10" fill="none" stroke="#D63B3B" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#D63B3B" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#D63B3B" stroke-opacity="0.12" stroke-width="1"/>
    <!-- Axes -->
    <line x1="50" y1="24" x2="50" y2="76" stroke="#D63B3B" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="24" y1="50" x2="76" y2="50" stroke="#D63B3B" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Sweep -->
    <path d="M 50 50 L 50 24 A 26 26 0 0 1 72.5 32 Z" fill="#D63B3B" fill-opacity="0.35"/>
    <line x1="50" y1="50" x2="50" y2="24" stroke="#F06A6A" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Center -->
    <circle cx="50" cy="50" r="2.5" fill="#D63B3B"/>
  </g>

  <!-- Wordmark -->
  <text x="170" y="85" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="38" fill="#f4f1f1" letter-spacing="4">PROMPTGUARD</text>
  <text x="170" y="115" font-family="monospace" font-size="13" fill="#575152" letter-spacing="3">AI PROMPT SECURITY SCANNER</text>

  <!-- Decorative grid lines -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="#302C2D" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#302C2D" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="200" y1="160" x2="200" y2="200" stroke="#302C2D" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="400" y1="160" x2="400" y2="200" stroke="#302C2D" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="600" y1="160" x2="600" y2="200" stroke="#302C2D" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom labels -->
  <text x="200" y="188" font-family="monospace" font-size="10" fill="#575152" text-anchor="middle" letter-spacing="1">SCAN</text>
  <text x="400" y="188" font-family="monospace" font-size="10" fill="#575152" text-anchor="middle" letter-spacing="1">DETECT</text>
  <text x="600" y="188" font-family="monospace" font-size="10" fill="#575152" text-anchor="middle" letter-spacing="1">REMEDIATE</text>
</svg>
